<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parikramaka Inductions</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="background-overlay"></div>

    <!-- Animated Stars -->
    <div class="stars"></div>

    <main class="container">

        <!-- Hero -->
        <section class="hero">

            <p class="club-name">
                PARIKRAMAKA
            </p>

            <h1>
                Student Satellite Club
            </h1>

            <h2>
                National Institute of Technology Rourkela
            </h2>

            <p class="tagline">
                Explore. Build. Launch.
            </p>

        </section>

        <!-- Form Card -->

        <section class="form-card">

            <div class="form-header">

                <h3>
                    Induction Form
                </h3>

                <p>
                    Fill in your details to apply for Parikramaka Inductions.
                </p>

            </div>

            <form id="inductionForm">

                <div class="input-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="rollNumber">
                        College Roll Number
                    </label>

                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="123AB4567"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="phoneNumber">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phoneNumber"
                        placeholder="9876543210"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="email">
                        Personal Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>
                        Primary Subsystem
                    </label>

                    <select
                        id="subsystem1"
                        required
                    >

                        <option value="" disabled selected>
                            Select Primary Subsystem
                        </option>

                        <option>
                            Command & Data Handling
                        </option>

                        <option>
                            Power
                        </option>

                        <option>
                            GNC & R&D
                        </option>

                        <option>
                            Structural & Thermal
                        </option>

                        <option>
                            Management
                        </option>

                    </select>

                </div>

                <div class="input-group">

                    <label>
                        Secondary Subsystem
                    </label>

                    <select
                        id="subsystem2"
                    >

                        <option value="" disabled selected>
                            Select Secondary Subsystem
                        </option>

                        <option>
                            Command & Data Handling
                        </option>

                        <option>
                            Power
                        </option>

                        <option>
                            GNC & R&D
                        </option>

                        <option>
                            Structural & Thermal
                        </option>

                        <option>
                            Management
                        </option>

                    </select>

                </div>

                <div class="input-group">

                    <label>
                        What do you hope to achieve by joining Parikramaka?
                    </label>

                    <textarea
                        id="primaryGoal"
                        rows="4"
                        placeholder="Tell us about your goals..."
                        required
                    ></textarea>

                </div>

                <div class="input-group">

                    <label>
                        How did you hear about us?
                    </label>

                    <select
                        id="howHeard"
                        required
                    >

                        <option value="" disabled selected>
                            Select an option
                        </option>

                        <option>
                            Friend
                        </option>

                        <option>
                            Social Media
                        </option>

                        <option>
                            Website
                        </option>

                        <option>
                            Event
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    id="submitBtn"
                >
                    Submit Application
                </button>

                <div id="statusMessage"></div>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
